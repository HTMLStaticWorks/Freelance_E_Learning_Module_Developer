<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | EduPro</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(160deg, #e2e8f0 0%, #f8fafc 55%, #dbeafe 100%);
        }
        .auth-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-panel {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            border: 1px solid #dbe2ea;
            border-radius: 1rem;
            box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
            padding: 2rem;
        }
        .auth-brand {
            color: var(--primary-color);
            font-weight: 800;
            letter-spacing: 0.03em;
            font-size: 1.9rem;
            margin-bottom: 1.1rem;
            display: block;
            text-align: center;
            text-decoration: none;
        }
        .auth-title {
            color: var(--secondary-color);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.6rem;
            text-align: center;
        }
        .field-label {
            color: #1f2937;
            font-weight: 500;
            margin-bottom: 0.45rem;
        }
        .field-control {
            background: #f8fafc;
            border: 1px solid #dbe2ea;
            border-radius: 0.6rem;
            padding: 0.78rem 0.85rem;
            font-size: 1.05rem;
        }
        .field-control:focus {
            background: #ffffff;
            border-color: var(--primary-color);
            box-shadow: none;
        }
        .pass-wrap {
            position: relative;
        }
        .pass-eye {
            position: absolute;
            right: 0.8rem;
            top: 50%;
            transform: translateY(-50%);
            color: #4b5563;
            font-size: 1rem;
            cursor: pointer;
        }
        .terms-row {
            margin: 0.9rem 0 1.4rem;
            font-size: 1rem;
        }
        .auth-submit {
            width: 100%;
            border: 0;
            background: var(--primary-color);
            color: #ffffff;
            border-radius: 999px;
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            padding: 0.7rem 1rem;
            transition: background-color 0.2s ease;
        }
        .auth-submit:hover {
            background: var(--primary-hover);
        }
        .divider {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            margin: 1.45rem 0;
            color: #374151;
        }
        .divider::before,
        .divider::after {
            content: "";
            height: 1px;
            background: #cbd5e1;
            flex: 1;
        }
        .social-row {
            display: flex;
            gap: 0.7rem;
        }
        .social-btn {
            flex: 1;
            border: 1px solid #cfd3d9;
            background: #f8f8f8;
            color: #14233a;
            font-size: 1.02rem;
            padding: 0.72rem 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            border-radius: 999px;
            font-weight: 600;
        }
        .social-btn:hover {
            border-color: var(--primary-color);
            background: #eef4ff;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .auth-bottom {
            text-align: center;
            margin-top: 0.9rem;
            font-size: 1rem;
        }
        .auth-link {
            color: var(--primary-color);
            text-decoration: none;
        }
        .auth-link:hover {
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .terms-link {
            color: var(--primary-color);
            text-decoration: none;
        }
        .terms-link:hover {
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .top-actions {
            position: fixed;
            top: 1.2rem;
            right: 1.2rem;
            display: flex;
            gap: 0.6rem;
            z-index: 10;
        }
        .top-action-btn {
            width: 36px;
            height: 36px;
            border: 1px solid #dbe2ea;
            background: #ffffff;
            color: var(--secondary-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        [data-theme="dark"] body {
            background: linear-gradient(160deg, #0f172a 0%, #111827 55%, #0b1d42 100%);
        }
        [data-theme="dark"] .auth-panel {
            background: #1f2937;
            border-color: #374151;
        }
        [data-theme="dark"] .auth-title,
        [data-theme="dark"] .field-label,
        [data-theme="dark"] .auth-bottom,
        [data-theme="dark"] .divider {
            color: #e5e7eb;
        }
        [data-theme="dark"] .field-control {
            background: #111827;
            border-color: #374151;
            color: #f3f4f6;
        }
        [data-theme="dark"] .field-control::placeholder {
            color: #9ca3af;
        }
        [data-theme="dark"] .top-action-btn,
        [data-theme="dark"] .social-btn {
            background: #111827;
            color: #e5e7eb;
            border-color: #374151;
        }
        [data-theme="dark"] .form-check-label,
        [data-theme="dark"] .auth-bottom,
        [data-theme="dark"] .auth-bottom a {
            color: #d1d5db !important;
        }
        @media (max-width: 576px) {
            .auth-panel {
                padding: 1.4rem 1rem 1.2rem;
            }
            .auth-title {
                font-size: 1.9rem;
            }
            .auth-submit {
                font-size: 1rem;
            }
            .social-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="top-actions">
        <button class="top-action-btn" id="theme-toggle" aria-label="Toggle Theme" title="Toggle Theme">
            <i class="bi bi-moon-fill fs-4" id="theme-icon"></i>
        </button>
        <button class="top-action-btn" id="rtl-toggle" aria-label="Toggle RTL" title="Toggle RTL">
            <i class="bi bi-arrow-left-right fs-4"></i>
        </button>
    </div>

    <main class="auth-shell">
        <div class="auth-panel">
            <a href="index.html" class="auth-brand" aria-label="Go to Home">
                <i class="bi bi-mortarboard-fill me-2"></i>EduPro
            </a>
            <h1 class="auth-title">Create Account</h1>

            <form class="needs-validation" novalidate>
                <div class="mb-3">
                    <label class="field-label" for="fullName">Full Name</label>
                    <input id="fullName" type="text" class="form-control field-control" placeholder="Your full name" required>
                </div>
                <div class="mb-3">
                    <label class="field-label" for="signupEmail">Email Address</label>
                    <input id="signupEmail" type="email" class="form-control field-control" placeholder="name@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="field-label" for="signupPassword">Password</label>
                    <div class="pass-wrap">
                        <input id="signupPassword" type="password" class="form-control field-control pe-5" placeholder="********" required>
                        <i class="bi bi-eye-fill pass-eye"></i>
                    </div>
                </div>
                <div class="mb-2">
                    <label class="field-label" for="confirmPassword">Confirm Password</label>
                    <div class="pass-wrap">
                        <input id="confirmPassword" type="password" class="form-control field-control pe-5" placeholder="********" required>
                        <i class="bi bi-eye-fill pass-eye"></i>
                    </div>
                </div>
                <div class="terms-row">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="termsCheck" required>
                        <label class="form-check-label" for="termsCheck">I agree to the <a href="#" class="terms-link">Terms &amp; Conditions</a></label>
                    </div>
                </div>
                <button type="submit" class="auth-submit">CREATE ACCOUNT</button>
            </form>

            <div class="divider">OR</div>

            <div class="social-row">
                <button class="social-btn" type="button">
                    <i class="bi bi-google fs-5"></i> Google
                </button>
                <button class="social-btn" type="button">
                    <i class="bi bi-apple fs-5"></i> Apple
                </button>
            </div>

            <p class="auth-bottom mb-0">
                Already have an account? <a href="login.html" class="auth-link fw-semibold">Login</a>
            </p>
        </div>
    </main>

    <script>
        document.querySelectorAll('.pass-wrap .pass-eye').forEach((icon) => {
            icon.addEventListener('click', () => {
                const input = icon.closest('.pass-wrap')?.querySelector('input');
                if (!input) return;
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                icon.classList.toggle('bi-eye-fill', !isPassword);
                icon.classList.toggle('bi-eye-slash-fill', isPassword);
            });
        });
    </script>
    <script src="assets/js/main.js"></script>
</body>
</html>
