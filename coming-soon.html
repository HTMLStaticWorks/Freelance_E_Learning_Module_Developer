<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | EduPro</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .coming-soon-bg {
            background: linear-gradient(135deg, var(--secondary-color) 0%, #0f172a 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .coming-soon-bg::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(37,99,235,0.2) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            border-radius: 50%;
        }
        .coming-soon-content {
            max-width: 960px;
            margin: 0 auto;
        }
        .brand-stack {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .brand-stack .brand-link {
            margin-bottom: 0;
        }
        .launch-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .coming-soon-bg h1,
        .coming-soon-bg h3,
        .coming-soon-bg h5,
        .coming-soon-bg p,
        .coming-soon-bg .timer-box h2,
        .coming-soon-bg .timer-box span {
            color: #ffffff !important;
            opacity: 1 !important;
        }
        .coming-soon-bg .lead {
            color: rgba(255, 255, 255, 0.9) !important;
        }
        .coming-soon-bg .fade-in-up {
            opacity: 1;
            transform: none;
        }
        .timer-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 1.5rem;
            min-width: 100px;
        }
        .coming-soon-bg .social-icons a {
            margin: 0 0.35rem;
        }
        .notify-form {
            max-width: 760px;
            margin: 0 auto 2.5rem;
        }
        .form-control-glass {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .form-control-glass::placeholder { color: rgba(255, 255, 255, 0.5); }
        .form-control-glass:focus {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border-color: var(--primary-color);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="coming-soon-bg">
        <div class="container position-relative z-1 py-5">
            <div class="row justify-content-center">
                <div class="col-12 coming-soon-content fade-in-up">
                    <div class="brand-stack">
                        <a href="index.html" class="text-decoration-none d-inline-block brand-link">
                            <h3 class="fw-bold text-white m-0"><i class="bi bi-mortarboard-fill text-primary me-2"></i>EduPro</h3>
                        </a>
                        <span class="badge bg-primary text-white px-3 py-2 rounded-pill launch-badge">New Platform Launching Soon</span>
                    </div>
                    <h1 class="display-3 fw-bold mb-4">We are building something amazing.</h1>
                    <p class="lead opacity-75 mb-5">A brand new marketplace for premium, ready-to-use corporate SCORM templates is currently under development.</p>

                    <div class="d-flex justify-content-center gap-3 flex-wrap mb-5">
                        <div class="timer-box text-center">
                            <h2 class="display-4 fw-bold mb-0">14</h2>
                            <span class="text-uppercase small opacity-75">Days</span>
                        </div>
                        <div class="timer-box text-center">
                            <h2 class="display-4 fw-bold mb-0">08</h2>
                            <span class="text-uppercase small opacity-75">Hours</span>
                        </div>
                        <div class="timer-box text-center">
                            <h2 class="display-4 fw-bold mb-0">45</h2>
                            <span class="text-uppercase small opacity-75">Mins</span>
                        </div>
                    </div>

                    <h5 class="fw-bold mb-3">Get Notified</h5>
                    <form class="needs-validation notify-form" novalidate>
                        <div class="input-group input-group-lg">
                            <input type="email" class="form-control form-control-glass" placeholder="Enter your email" required>
                            <button class="btn btn-primary px-4" type="submit">Notify Me</button>
                        </div>
                    </form>

                    <div class="social-icons">
                        <a href="#" class="bg-white text-dark border-0"><i class="bi bi-linkedin"></i></a>
                        <a href="#" class="bg-white text-dark border-0"><i class="bi bi-twitter-x"></i></a>
                        <a href="#" class="bg-white text-dark border-0"><i class="bi bi-youtube"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
