<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | EduPro</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/dark-mode.css">
    <style>
        .error-404-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at top, #0f274d 0%, #0b1220 55%, #070d18 100%);
            color: #fff;
            padding: 2rem 1rem;
        }
        .error-404-wrap {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
        }
        .error-code {
            font-size: clamp(6rem, 18vw, 11rem);
            line-height: 1;
            font-weight: 800;
            color: rgba(37, 99, 235, 0.95);
            margin-bottom: 1.25rem;
            letter-spacing: 0.05em;
        }
        .error-icon {
            font-size: clamp(2.2rem, 5vw, 3.2rem);
            color: #cbd5e1;
            margin-bottom: 1.5rem;
        }
        .error-title {
            color: #ffffff !important;
            font-size: clamp(1.75rem, 4vw, 2.7rem);
            margin-bottom: 1rem;
        }
        .error-desc {
            color: rgba(255, 255, 255, 0.82) !important;
            font-size: clamp(1rem, 2.1vw, 1.25rem);
            margin-bottom: 2.25rem;
        }
    </style>
</head>
<body>
    <main class="error-404-page">
        <div class="error-404-wrap fade-in-up visible">
            <h1 class="error-code">404</h1>
            <div class="error-icon"><i class="bi bi-plug-fill"></i></div>
            <h2 class="fw-bold error-title">Oops! Module Not Found.</h2>
            <p class="error-desc">It looks like the link you followed is broken, or the page has been removed. Let's get you back on track.</p>
            <a href="index.html" class="btn btn-primary btn-lg px-5"><i class="bi bi-house-door me-2"></i>Return Home</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
